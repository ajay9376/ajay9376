<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_HUD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#090e1c" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>
    <linearGradient id="crimsonGrad_HUD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A54" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="cyanGrad_HUD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="scanGrad_HUD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A54" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF2A54" stop-opacity="0" />
    </linearGradient>
    <pattern id="dotPat_HUD" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.35" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseLed_HUD {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    @keyframes wavePulse_HUD {
      0% { r: 10; opacity: 0.9; }
      100% { r: 90; opacity: 0; }
    }
    @keyframes scanMotion_HUD {
      0% { transform: translateY(0px); opacity: 0; }
      10% { opacity: 0.7; }
      90% { opacity: 0.7; }
      100% { transform: translateY(420px); opacity: 0; }
    }
    @keyframes webGlitch_HUD {
      0%, 94%, 100% { transform: translate(0, 0); }
      95% { transform: translate(-2px, 1px); }
      97% { transform: translate(1px, -1px); }
    }
    .hud-title_HUD {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .hud-mono_HUD {
      font-family: "SF Mono", "Fira Code", "Courier New", monospace;
      font-size: 11px;
      letter-spacing: 1.5px;
    }
    .led-pulse_HUD { animation: pulseLed_HUD 1.8s infinite ease-in-out; }
    .pulse-ring-1_HUD { transform-origin: 500px 180px; animation: wavePulse_HUD 3s infinite cubic-bezier(0.1, 0.8, 0.3, 1); }
    .pulse-ring-2_HUD { transform-origin: 500px 180px; animation: wavePulse_HUD 3s infinite cubic-bezier(0.1, 0.8, 0.3, 1) 1.5s; }
    .laser-scanner_HUD { animation: scanMotion_HUD 5s infinite linear; }
    .glitch-text_HUD { animation: webGlitch_HUD 7s infinite ease-in-out; }
  </style>

  <!-- Background -->
  <rect x="0" y="0" width="1000" height="420" rx="14" fill="url(#bgGrad_HUD)" stroke="#1a2333" stroke-width="2" />
  <rect x="0" y="0" width="1000" height="420" fill="url(#dotPat_HUD)" opacity="0.4" />

  <!-- Laser Scan Line -->
  <g class="laser-scanner_HUD">
    <line x1="10" y1="0" x2="990" y2="0" stroke="url(#scanGrad_HUD)" stroke-width="2" />
  </g>

  <!-- HUD Corners -->
  <path d="M 25 15 L 15 15 L 15 25" stroke="#FF2A54" stroke-width="3" fill="none" />
  <path d="M 975 15 L 985 15 L 985 25" stroke="#FF2A54" stroke-width="3" fill="none" />
  <path d="M 15 395 L 15 405 L 25 405" stroke="#00F2FE" stroke-width="3" fill="none" />
  <path d="M 985 395 L 985 405 L 975 405" stroke="#00F2FE" stroke-width="3" fill="none" />

  <!-- Corner Lines -->
  <line x1="35" y1="15" x2="160" y2="15" stroke="#1e293b" stroke-width="1.5" />
  <line x1="840" y1="15" x2="965" y2="15" stroke="#1e293b" stroke-width="1.5" />
  <line x1="15" y1="35" x2="15" y2="120" stroke="#1e293b" stroke-width="1.5" />
  <line x1="985" y1="35" x2="985" y2="120" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Spider-Web Geometry -->
  <g opacity="0.14" stroke="#00F2FE" stroke-width="1" fill="none">
    <polygon points="500,60 620,110 650,180 620,250 500,300 380,250 350,180 380,110" />
    <polygon points="500,100 580,135 600,180 580,225 500,260 420,225 400,180 420,135" />
    <polygon points="500,135 545,155 560,180 545,205 500,225 455,205 440,180 455,155" />
    <line x1="500" y1="180" x2="500" y2="30" />
    <line x1="500" y1="180" x2="720" y2="60" />
    <line x1="500" y1="180" x2="760" y2="180" />
    <line x1="500" y1="180" x2="720" y2="300" />
    <line x1="500" y1="180" x2="500" y2="330" />
    <line x1="500" y1="180" x2="280" y2="300" />
    <line x1="500" y1="180" x2="240" y2="180" />
    <line x1="500" y1="180" x2="280" y2="60" />
  </g>

  <!-- Pulse Rings -->
  <circle cx="500" cy="180" r="10" stroke="#FF2A54" stroke-width="1.5" fill="none" class="pulse-ring-1_HUD" />
  <circle cx="500" cy="180" r="10" stroke="#00F2FE" stroke-width="1.5" fill="none" class="pulse-ring-2_HUD" />

  <!-- TOP STATUS HEADER -->
  <g class="hud-mono_HUD" fill="#94a3b8">
    <text x="35" y="38" fill="#FF2A54" font-weight="700">SPIDER-LAB // PROTOCOL: PETER_PARKER_V2</text>
    <circle cx="360" cy="34" r="4" fill="#FF2A54" class="led-pulse_HUD" />
    <text x="375" y="38" fill="#e2e8f0">SPIDER-SENSE: <tspan fill="#00ff88" font-weight="700">CALIBRATED</tspan></text>
    <text x="590" y="38">HOST: <tspan fill="#00F2FE">AMRITA VISHWA VIDYAPEETHAM</tspan></text>
    <text x="880" y="38" text-anchor="end" fill="#64748b">SYS-TIME: 2026.09.25 // SEC-02</text>
  </g>

  <line x1="30" y1="52" x2="970" y2="52" stroke="#1e293b" stroke-width="1.5" />
  <line x1="30" y1="52" x2="260" y2="52" stroke="#FF2A54" stroke-width="2" />
  <line x1="740" y1="52" x2="970" y2="52" stroke="#00F2FE" stroke-width="2" />

  <!-- CENTER HERO IDENTITY -->
  <g class="glitch-text_HUD">
    <!-- Spider Emblem -->
    <path d="M 500 135 L 507 148 L 515 145 L 508 155 L 522 165 L 507 167 L 516 185 L 503 175 L 500 190 L 497 175 L 484 185 L 493 167 L 478 165 L 492 155 L 485 145 L 493 148 Z"
          fill="#FF2A54" opacity="0.85" />

    <!-- Name -->
    <text x="500" y="225" text-anchor="middle" class="hud-title_HUD" font-size="44" fill="#ffffff">GUJJULA AJAY KUMAR</text>

    <!-- Subtitle -->
    <text x="500" y="255" text-anchor="middle" class="hud-mono_HUD" font-size="14" fill="#00F2FE" font-weight="700" letter-spacing="4px">&#x26A1; YOUR FRIENDLY NEIGHBORHOOD AI ENGINEER &#x26A1;</text>

    <!-- Motto -->
    <text x="500" y="283" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13.5" font-style="italic" fill="#94a3b8" letter-spacing="1px">"With great compute power comes great architectural responsibility."</text>
  </g>

  <!-- Mid-Separator -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="80" y1="305" x2="920" y2="305" />
    <circle cx="500" cy="305" r="3" fill="#FF2A54" />
    <circle cx="290" cy="305" r="2" fill="#00F2FE" />
    <circle cx="710" cy="305" r="2" fill="#00F2FE" />
  </g>

  <!-- BOTTOM 4-NODE HUD MATRIX -->
  <g transform="translate(60, 320)">
    <rect width="200" height="75" rx="6" fill="#0c1220" stroke="#1e293b" stroke-width="1.2" />
    <rect width="200" height="3" fill="#FF2A54" />
    <text x="14" y="24" class="hud-mono_HUD" font-size="9.5" fill="#FF2A54" font-weight="700">// RADAR SUBSYSTEM</text>
    <text x="14" y="44" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">TruthLens-AI</text>
    <text x="14" y="62" class="hud-mono_HUD" font-size="9" fill="#00ff88">&#x25CF; 4-SIGNAL FORENSICS</text>
  </g>

  <g transform="translate(285, 320)">
    <rect width="200" height="75" rx="6" fill="#0c1220" stroke="#1e293b" stroke-width="1.2" />
    <rect width="200" height="3" fill="#00F2FE" />
    <text x="14" y="24" class="hud-mono_HUD" font-size="9.5" fill="#00F2FE" font-weight="700">// SECURITY RADAR</text>
    <text x="14" y="44" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">NetSentinel</text>
    <text x="14" y="62" class="hud-mono_HUD" font-size="9" fill="#00ff88">&#x25CF; REAL-TIME TELEMETRY</text>
  </g>

  <g transform="translate(510, 320)">
    <rect width="200" height="75" rx="6" fill="#0c1220" stroke="#1e293b" stroke-width="1.2" />
    <rect width="200" height="3" fill="#FF2A54" />
    <text x="14" y="24" class="hud-mono_HUD" font-size="9.5" fill="#FF2A54" font-weight="700">// DAA SOLVER</text>
    <text x="14" y="44" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Map Puzzle CSP</text>
    <text x="14" y="62" class="hud-mono_HUD" font-size="9" fill="#00F2FE">&#x25CF; GRAPH COLORING</text>
  </g>

  <g transform="translate(735, 320)">
    <rect width="205" height="75" rx="6" fill="#0c1220" stroke="#1e293b" stroke-width="1.2" />
    <rect width="205" height="3" fill="#00F2FE" />
    <text x="14" y="24" class="hud-mono_HUD" font-size="9.5" fill="#00F2FE" font-weight="700">// WEB INTEGRITY</text>
    <text x="14" y="44" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Spider-Network</text>
    <text x="14" y="62" class="hud-mono_HUD" font-size="9" fill="#00ff88">&#x25CF; GITHUB SYNC ACTIVE</text>
  </g>

  <!-- Lower Border -->
  <line x1="30" y1="400" x2="970" y2="400" stroke="#1e293b" stroke-width="1" />
  <circle cx="500" cy="400" r="2.5" fill="#FF2A54" />
</svg>
