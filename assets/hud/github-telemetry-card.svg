<svg xmlns="http://www.w3.org/2000/svg" width="700" height="200" viewBox="0 0 700 200">
  <defs>
    <linearGradient id="cardBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16" />
      <stop offset="60%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Activity Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF2A54" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#070b16" stop-opacity="0" />
    </linearGradient>

    <filter id="glowFilt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseTarget {
      0%, 100% { r: 3; opacity: 1; }
      50% { r: 5; opacity: 0.5; }
    }
    .wave-pulse { animation: pulseTarget 2.5s infinite ease-in-out; }
  </style>

  <!-- Container Base -->
  <rect x="1" y="1" rx="8" ry="8" width="698" height="198" fill="url(#cardBgGrad)" stroke="#1a2538" stroke-width="1.3" />

  <!-- Corner Brackets -->
  <path d="M 8 8 L 16 8 M 8 8 L 8 16" stroke="#FF2A54" stroke-width="2" fill="none" />
  <path d="M 692 8 L 684 8 M 692 8 L 692 16" stroke="#00F2FE" stroke-width="2" fill="none" />
  <path d="M 8 192 L 16 192 M 8 192 L 8 184" stroke="#00F2FE" stroke-width="2" fill="none" />
  <path d="M 692 192 L 684 192 M 692 192 L 692 184" stroke="#FF2A54" stroke-width="2" fill="none" />

  <!-- =============================================================== -->
  <!-- LEFT: DEVELOPER IDENTITY (FULL UNTRUNCATED NAME)                 -->
  <!-- =============================================================== -->
  
  <!-- FULL NAME: GUJJULA AJAY KUMAR (Completely filled, no truncation!) -->
  <text x="26" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="1px">
    GUJJULA AJAY KUMAR
  </text>
  <text x="265" y="38" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" font-weight="700" fill="#00F2FE">
    (@ajay9376)
  </text>

  <!-- Subtitle -->
  <text x="26" y="55" font-family="'SF Mono', 'Fira Code', monospace" font-size="9" fill="#FF2A54" letter-spacing="1.5px">
    SPIDER-LAB // AMRITA VISHWA VIDYAPEETHAM NODE
  </text>

  <line x1="26" y1="64" x2="310" y2="64" stroke="#1e293b" stroke-width="1" />

  <!-- Telemetry Metrics List -->
  <g transform="translate(26, 75)" font-family="'SF Mono', 'Fira Code', monospace" font-size="11">
    <!-- Row 1: Commits -->
    <g transform="translate(0, 14)">
      <circle cx="6" cy="-4" r="3.5" fill="#00ff88" />
      <text x="18" y="0" fill="#94a3b8">Total Commits:</text>
      <text x="145" y="0" fill="#f8fafc" font-weight="700">60+ Production Commits</text>
    </g>

    <!-- Row 2: Public Repos -->
    <g transform="translate(0, 36)">
      <circle cx="6" cy="-4" r="3.5" fill="#00F2FE" />
      <text x="18" y="0" fill="#94a3b8">Repositories:</text>
      <text x="145" y="0" fill="#f8fafc" font-weight="700">6 Public Projects</text>
    </g>

    <!-- Row 3: Research Missions -->
    <g transform="translate(0, 58)">
      <circle cx="6" cy="-4" r="3.5" fill="#FF2A54" />
      <text x="18" y="0" fill="#94a3b8">Active Missions:</text>
      <text x="145" y="0" fill="#f8fafc" font-weight="700">TruthLens &bull; NetSentinel &bull; DAA</text>
    </g>

    <!-- Row 4: Network Status -->
    <g transform="translate(0, 80)">
      <circle cx="6" cy="-4" r="3.5" fill="#00ff88" />
      <text x="18" y="0" fill="#94a3b8">Spider-Sense:</text>
      <text x="145" y="0" fill="#00ff88" font-weight="700">ACTIVE &bull; CONTINUOUS TELEMETRY</text>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="330" y1="20" x2="330" y2="180" stroke="#1e293b" stroke-width="1.2" />
  <circle cx="330" cy="100" r="3" fill="#00F2FE" />

  <!-- =============================================================== -->
  <!-- RIGHT: REAL-TIME ACTIVITY WAVEFORM & TELEMETRY                   -->
  <!-- =============================================================== -->
  <g transform="translate(340, 0)">
    <!-- Header of Graph -->
    <text x="15" y="32" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" font-weight="700" fill="#FF2A54" letter-spacing="1.5px">
      // ACTIVITY FREQUENCY SPECTRUM
    </text>
    <text x="330" y="32" text-anchor="end" font-family="'SF Mono', 'Fira Code', monospace" font-size="9" fill="#00F2FE">
      STATUS: OPTIMAL
    </text>

    <!-- Grid Lines -->
    <g stroke="#162032" stroke-width="0.8">
      <line x1="15" y1="50" x2="335" y2="50" stroke-dasharray="2,3" />
      <line x1="15" y1="85" x2="335" y2="85" stroke-dasharray="2,3" />
      <line x1="15" y1="120" x2="335" y2="120" stroke-dasharray="2,3" />
      <line x1="15" y1="155" x2="335" y2="155" />
    </g>

    <!-- Activity Wave Area & Path -->
    <path d="M 15 155 
             L 35 152 
             L 65 140 
             L 95 148 
             L 125 110 
             L 155 130 
             L 185 85 
             L 215 95 
             L 245 45 
             L 275 75 
             L 305 60 
             L 335 50 
             L 335 155 Z" 
          fill="url(#waveGrad)" />

    <path d="M 15 155 
             L 35 152 
             L 65 140 
             L 95 148 
             L 125 110 
             L 155 130 
             L 185 85 
             L 215 95 
             L 245 45 
             L 275 75 
             L 305 60 
             L 335 50" 
          stroke="#00F2FE" stroke-width="2.2" fill="none" filter="url(#glowFilt)" />

    <!-- Wave Target Blips -->
    <circle cx="245" cy="45" r="4" fill="#FF2A54" class="wave-pulse" />
    <circle cx="335" cy="50" r="4" fill="#00ff88" class="wave-pulse" />
    <circle cx="185" cy="85" r="3" fill="#00F2FE" />

    <!-- Bottom Timeline Ticks -->
    <g transform="translate(15, 170)" font-family="'SF Mono', 'Fira Code', monospace" font-size="8.5" fill="#64748b">
      <text x="0" y="0">OCT</text>
      <text x="60" y="0">DEC</text>
      <text x="120" y="0">FEB</text>
      <text x="180" y="0">APR</text>
      <text x="240" y="0">JUN</text>
      <text x="300" y="0">AUG</text>
    </g>
  </g>
</svg>
