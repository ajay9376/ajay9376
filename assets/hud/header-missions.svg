  <path d="M 892 51 L 892 58 L 885 58" stroke="#00F2FE" stroke-width="1.8" fill="none" />

  <!-- Section Number Badge -->
  <g transform="translate(24, 15)">
    <rect width="40" height="36" rx="5" fill="#0f172a" stroke="#00F2FE" stroke-width="1.2" />
