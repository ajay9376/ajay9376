<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 75" width="100%" height="100%">
  <defs>
    <linearGradient id="webGradCrimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A54" stop-opacity="0" />
      <stop offset="30%" stop-color="#FF2A54" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="1" />
      <stop offset="70%" stop-color="#FF2A54" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FF2A54" stop-opacity="0" />
    </linearGradient>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    @keyframes webTension {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 0.9; filter: drop-shadow(0 0 5px #00F2FE); }
    }
    @keyframes nodePulse {
      0%, 100% { r: 4; fill: #FF2A54; }
      50% { r: 6; fill: #00F2FE; }
    }
    .web-strand { animation: webTension 3.5s infinite ease-in-out; }
    .pulse-node { animation: nodePulse 3.5s infinite ease-in-out; }
  </style>

  <!-- Left and Right Hanging Web Lines -->
  <path d="M 50 0 C 180 45, 360 55, 480 50" stroke="#FF2A54" stroke-width="1.2" fill="none" opacity="0.4" />
  <path d="M 950 0 C 820 45, 640 55, 520 50" stroke="#00F2FE" stroke-width="1.2" fill="none" opacity="0.4" />

  <!-- Center Tension Web Chord -->
  <line x1="120" y1="0" x2="500" y2="45" stroke="#1e293b" stroke-width="1" />
  <line x1="880" y1="0" x2="500" y2="45" stroke="#1e293b" stroke-width="1" />
  <line x1="500" y1="0" x2="500" y2="75" stroke="url(#webGradCrimson)" stroke-width="2" class="web-strand" />

  <!-- Node Anchor -->
  <circle cx="500" cy="45" r="4" class="pulse-node" filter="url(#nodeGlow)" />
  <circle cx="500" cy="45" r="10" stroke="#FF2A54" stroke-width="0.8" fill="none" opacity="0.5" />

  <!-- Sub Node Anchors -->
  <circle cx="340" cy="38" r="2.5" fill="#00F2FE" opacity="0.6" />
  <circle cx="660" cy="38" r="2.5" fill="#FF2A54" opacity="0.6" />

  <!-- Technical Node Label -->
  <rect x="420" y="58" width="160" height="15" rx="3" fill="#060913" stroke="#1e293b" stroke-width="1" />
  <text x="500" y="69" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="8.5" fill="#94a3b8" letter-spacing="1.5px">
    NODE // 01_ORIGIN
  </text>
</svg>
