<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 95" width="100%" height="100%">
  <defs>
    <linearGradient id="mGrad_CGPA_CALCULATOR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1424" />
      <stop offset="100%" stop-color="#060912" />
    </linearGradient>
  </defs>

  <!-- Dossier Header Frame -->
  <rect x="0" y="0" width="500" height="95" rx="8" fill="url(#mGrad_CGPA_CALCULATOR)" stroke="#1e293b" stroke-width="1.2" />
  
  <!-- Left Accent Strip -->
  <rect x="0" y="0" width="5" height="95" fill="#FF2A54" />

  <!-- Corner Tech Reticle -->
  <path d="M 485 10 L 492 10 L 492 17" stroke="#FF2A54" stroke-width="1.5" fill="none" />
  <path d="M 492 80 L 492 87 L 485 87" stroke="#FF2A54" stroke-width="1.5" fill="none" />

  <!-- Code and Priority -->
  <text x="18" y="24" font-family="'SF Mono', 'Fira Code', monospace" font-size="10.5" font-weight="700" fill="#FF2A54" letter-spacing="1.5px">
    MISSION // 005 &bull; <tspan fill="#64748b">PRIORITY: UTILITY</tspan>
  </text>

  <!-- Project Codename Title -->
  <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="900" fill="#f8fafc" letter-spacing="1px">
    CGPA_CALCULATOR
  </text>

  <!-- Type Subtitle -->
  <text x="18" y="74" font-family="'SF Mono', 'Fira Code', monospace" font-size="9" fill="#94a3b8" letter-spacing="1px">
    TYPE: ACADEMIC PERFORMANCE / METRIC EVALUATOR
  </text>

  <!-- Status Pill in Top-Right -->
  <g transform="translate(350, 14)">
    <rect width="130" height="22" rx="4" fill="#070b14" stroke="#00ff88" stroke-width="1" />
    <circle cx="12" cy="11" r="3.5" fill="#00ff88" />
    <text x="24" y="15" font-family="'SF Mono', 'Fira Code', monospace" font-size="8.5" font-weight="700" fill="#00ff88" letter-spacing="1px">
      STATUS: COMPLETED
    </text>
